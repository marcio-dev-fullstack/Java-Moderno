name: Deploy to Azure Web Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image to Azure Container Registry
        run: |
          docker build -t devhubacr.azurecr.io/dev-knowledge-ai-hub:${{ github.sha }} .
          docker push devhubacr.azurecr.io/dev-knowledge-ai-hub:${{ github.sha }}
