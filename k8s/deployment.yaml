apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-knowledge-ai-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-knowledge-ai-hub
  template:
    metadata:
      labels:
        app: dev-knowledge-ai-hub
    spec:
      containers:
      - name: dev-knowledge-ai-hub
        image: dev-knowledge-ai-hub:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
