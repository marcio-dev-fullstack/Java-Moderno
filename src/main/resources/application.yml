spring:
  application:
    name: dev-knowledge-ai-hub
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/devhubdb
    username: devuser
    password: devpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      group-id: devhub-group
      auto-offset-reset: earliest
  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:localhost}:11434
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text

jwt:
  secret: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: dev-knowledge-ai-hub
    distribution:
      percentiles-histogram:
        http.server.requests: true
